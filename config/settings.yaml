# config/settings.yaml
# ─────────────────────────────────────────────────────────────────────────
# SIAP v2.5 — Model Cascade Configuration
# Cascade: 1. Primary (original default) → 2. Fallback 1 (original fallback)
#          → 3. Fallback 2 (Ollama local) → 4. Fallback 3 (Gemini API)
# ─────────────────────────────────────────────────────────────────────────

ollama:
  base_url: "http://localhost:11434"
  office_model: "gemma3:4b"
  # Gemma 3 supports 10k+ context, but 2048 is the responsive setting on
  # this local machine. Increase only on hardware that benchmarks well.
  gemma3_context_tokens: 2048

api_keys:
  gemini:     "${GEMINI_API_KEY}"
  openai:     "${OPENAI_API_KEY}"
  anthropic:  "${ANTHROPIC_API_KEY}"

# Public YouTube recommendation scanner (controlled beta)
youtube_signals:
  api_key: "${GROQ_API_KEY}"
  scan:
    lookback_days_default: 14
    max_videos_per_channel: 6
    max_deep_dives: 6
    # One local Gemma server should process one stock pipeline at a time.
    deep_dive_concurrency: 1
  deep_dive:
    # Architecture §6: scanner deep-dives reuse the quick HFIP mode.
    execution_mode: "quick"
    skip_debate: false
    timeout_seconds: 360
  transcription:
    prefer_captions: true
    translation_model: "whisper-large-v3" # turbo cannot translate audio to English
    caption_translation_model: "llama-3.3-70b-versatile"
  extraction:
    model: "llama-3.3-70b-versatile"
    temperature: 0.1
  ranking:
    top_n_default: 5
    max_per_sector: 2

agents:
  intelligence_builder:
    model:    null
    fallback: null
    fallback_2: null
    fallback_3: null

  fundamental:
    model:    "deepseek-v4-pro"
    fallback: "glm-5.2"
    fallback_2: "qwen2.5-14b"
    fallback_3: "gemini-2.5-flash"
    temperature: 0.1
    max_tokens: 10000

  macro:
    model:    "glm-5.2"
    fallback: "deepseek-v4-pro"
    fallback_2: "qwen2.5-14b"
    fallback_3: "gemini-2.5-flash"
    temperature: 0.2
    max_tokens: 2000

  moat:
    model:    "gemini-flash"
    fallback: "minimax-m2.1"
    fallback_2: "qwen2.5-14b"
    fallback_3: "gemini-2.5-flash"
    temperature: 0.2
    max_tokens: 10000

  risk_narrative:
    model:    "glm-5.2"
    fallback: "deepseek-v4-pro"
    fallback_2: "qwen2.5-14b"
    fallback_3: "gemini-2.5-flash"
    temperature: 0.1
    max_tokens: 10000

  growth_valuation:
    model:    "gemini-flash"
    fallback: "minimax-m2.1"
    fallback_2: "qwen2.5-14b"
    fallback_3: "gemini-2.5-flash"
    temperature: 0.2
    max_tokens: 10000

  market_regime:
    model:    "minimax-m2.1"
    fallback: "glm-5.2"
    fallback_2: "qwen2.5-14b"
    fallback_3: "gemini-2.5-flash"
    temperature: 0.2
    max_tokens: 10000

  evidence_auditor:
    model:    "gpt-oss-120b"
    fallback: "glm-5.2"
    fallback_2: "qwen2.5-14b"
    fallback_3: "gemini-2.5-flash"
    temperature: 0.1
    max_tokens: 10000

  bull_debate:
    model:    "kimi-k2.5"
    fallback: "gpt-oss-120b"
    fallback_2: "qwen2.5-14b"
    fallback_3: "gemini-2.5-flash"
    temperature: 0.5
    max_tokens: 10000

  bear_debate:
    model:    "kimi-k2.5"
    fallback: "gpt-oss-120b"
    fallback_2: "qwen2.5-14b"
    fallback_3: "gemini-2.5-flash"
    temperature: 0.5
    max_tokens: 10000

  cio:
    model:    "deepseek-v4-pro"
    fallback: "glm-5.2"
    fallback_2: "qwen2.5-14b"
    fallback_3: "gemini-2.5-flash"
    temperature: 0.1
    max_tokens: 10000

scoring_weights:
  fundamental:    0.25
  macro:          0.20
  moat:           0.15
  growth:         0.20
  risk:           0.20

duration_weight_overrides:
  short_6_12m:    { fundamental: 0.20, macro: 0.30, moat: 0.10, growth: 0.20, risk: 0.20 }
  medium_1_3yr:   { fundamental: 0.25, macro: 0.20, moat: 0.15, growth: 0.20, risk: 0.20 }
  long_3_7yr:     { fundamental: 0.30, macro: 0.10, moat: 0.25, growth: 0.25, risk: 0.10 }
  vlong_7yr_plus: { fundamental: 0.30, macro: 0.05, moat: 0.30, growth: 0.25, risk: 0.10 }

execution_modes:
  quick:
    skip_agents:    ["moat", "risk_narrative"]
    debate_rounds:  2
    regime:         "simplified"

  balanced:
    skip_agents:    []
    debate_rounds:  4
    committee_qa:   true
    regime:         "full"

  premium:
    skip_agents:    []
    debate_rounds:  6
    committee_qa:   true
    regime:         "full"
    cio_depth:      "extended"

default_execution_mode: "balanced"

cache:
  knowledge_graph_ttl_hours:  4
  news_ttl_hours:             6
  regime_ttl_hours:           2
  llm_response_ttl_hours:     24
